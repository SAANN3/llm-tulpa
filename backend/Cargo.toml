[package]
name = "backend"
version = "0.1.2"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
# `normalize_images` (plugins/messaging/plugin.rs) always fully decodes an incoming
# image — not just format-sniffs it — so a truncated/corrupted download gets caught
# and dropped instead of reaching Ollama; these are every codec that decode path can
# actually hit (whatever Ollama's own decoder already handles, plus webp, which it
# doesn't), "png" doubling as the one format ever re-encoded into.
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif", "bmp"] }
dirs = "6.0.0"
gfxinfo = "0.1.2"
log = "0.4.33"
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.4", features = ["json", "form"] }
sea-orm = { version = "2.0.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
sysinfo = "0.39.6"
teloxide-core = { version = "0.13.0", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.1", features = ["full"] }
tool_derive = { path = "tool_derive" }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
