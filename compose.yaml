include:
  - postgres/compose.yaml
  - llm/compose.yaml
  - searxng/compose.yaml

services:
  backend:
    build:
      context: ./backend
      # The isolated build-time network can't resolve deb.debian.org on this
      # machine (a systemd-resolved-style local stub resolver that only the host
      # itself can reach, not the container's own bridge network) — building
      # against the host's network directly sidesteps that instead of requiring a
      # system-wide Docker daemon DNS override.
      network: host
    # Runs as the invoking user instead of root, so files the storage.* tools create
    # on the host (through the passthrough below) are owned by you, not root — no
    # value is hardcoded here, it's whoever ran `docker compose up`. Named HOST_UID/
    # HOST_GID rather than UID/GID: UID is a bash builtin, readonly — `UID=... cmd`
    # silently fails to set it (bash errors but still runs the command). Set them
    # explicitly since bash doesn't export these to child processes by default:
    #   HOST_UID=$(id -u) HOST_GID=$(id -g "$(whoami)") docker compose up -d
    # (`id -g "$(whoami)"` rather than bare `id -g` — if docker access came from
    # `newgrp docker` instead of a real relogin, the current shell's *effective*
    # group is temporarily `docker`, not your real one; looking the group up by
    # username directly sidesteps that.)
    # Falls back to 1000:1000 (the common first-user default on Linux) if unset.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Host networking instead of the `app-net` bridge: a bridged container's
    # traffic doesn't pass through any host-level VPN/proxy routing (e.g. sing-box's
    # TUN mode) the way a normal host process's traffic does, which broke outbound
    # access to providers blocked on the raw network (Telegram, for us) even though
    # the same requests work fine from the host itself. Sharing the host's network
    # namespace directly restores that. `postgres`/`ollama` no longer resolve as
    # Docker service names under this mode, so both are addressed via `localhost`
    # instead — safe since both already publish to 127.0.0.1 on the host (see
    # postgres/compose.yaml and llm/compose.yaml).
    network_mode: host
    # Shares the host's PID namespace too, same reasoning as network_mode above —
    # os.get_process_list otherwise only ever sees this container's own handful of
    # processes, never the host's real ones. Side effect worth knowing: since this
    # container already runs as the real host user (via HOST_UID/HOST_GID above, not
    # root), os.execute_command can now also signal (e.g. kill) real host processes
    # owned by that same user — Linux's kill() permission check is UID-based, not
    # PID-namespace-based, so sharing the namespace is enough once the UID already
    # matches. Root-owned host processes stay out of reach either way. Not a new
    # *unsupervised* risk on its own: execute_command already requires a fresh
    # approval for every single call.
    pid: host
    environment:
      - OLLAMA_URL=http://localhost:11434
      - OLLAMA_MODEL_NAME=${OLLAMA_MODEL_NAME:-local-llm}
      # Reached the same way ollama/postgres are under host networking — port
      # 8090 is the searxng-nginx rate-limiting sidecar in front of the real
      # searxng service (which binds 8080 directly, see searxng/compose.yaml and
      # searxng/nginx.conf); both run network_mode: host too, for real outbound
      # internet access (a bridged searxng container couldn't reach google/bing/
      # duckduckgo at all — didn't go through the host's VPN routing).
      - SEARXNG_URL=http://localhost:8090
      - DATABASE_URL=postgres://postgres:postgres@localhost:5432
      - DATABASE_NAME=${DATABASE_NAME:-llm_tulpa}
      - AGENT_HISTORY_LEN=${AGENT_HISTORY_LEN:-200}
      # Same variable name/default as llm/compose.yaml's OLLAMA_CONTEXT_LENGTH — set
      # it once (e.g. in a root .env file) and both Ollama's real context and this
      # backend's token-budget math stay in sync.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-32768}
      # 0.0.0.0 inside the container so Docker's port publishing can reach it — the
      # host-side publish below is what actually keeps this loopback-only from
      # outside the machine, matching the native default's intent.
      - BIND_ADDR=0.0.0.0:3000
      - HOME=${HOME}
      # Tells os.get_disk_space where the host's real root is mounted (below), so it
      # reports genuine host disk stats instead of the container's own storage.
      - HOST_ROOT=/hostfs
    volumes:
      # Passthrough so the storage.* tools can read/write real files at the same
      # absolute paths as a native run. Docker won't let a bind mount target `/`
      # itself, so this covers every user's home directory instead — everything
      # actually used so far lives under `~`. Add more top-level mounts the same
      # way (e.g. `- "/mnt:/mnt"`) if something outside `/home` ever needs to be
      # reachable too.
      - "/home:/home"
      # Read-only, separate from the passthrough above — exists only so
      # os.get_disk_space can see the host's real root filesystem (size/used/free),
      # not for tools to read/write through it.
      - "/:/hostfs:ro"
    depends_on:
      - postgres
      - ollama
      - searxng
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      network: host
      # Unset by default — see frontend/Dockerfile and frontend/src/config.ts for why.
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    ports:
      - "5173:80"
    networks:
      - app-net
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app-net:
