services:
  ollama:
    # This is the default, day-to-day backend — the backend's `ollama.url`
    # (backend/data/settings.json) points here. `llama-mtp`/`mtp-proxy` below are the optional ones now: real
    # testing through the actual chat API (not an isolated benchmark) found MTP
    # unbearably slow at real conversation-depth context on the model this project
    # was running at the time (~4-5 tok/s sustained, despite a much faster
    # clean-benchmark ceiling — see project memory for the fuller writeup and where
    # MTP *did* clearly win, so it's still worth an occasional per-task A/B, not
    # written off entirely).
    image: "ollama/ollama:rocm"
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    # Docker's default locked-memory limit (8MB) is far too small for pinning a
    # large model's GPU-DMA host buffer — without this, that allocation silently
    # falls back to slow, page-fault-driven regular memory instead of failing loudly.
    ulimits:
      memlock: -1
    environment:
      # Optional: a .gguf under MODEL_DIR to register as the model `local-llm` at container
      # start. Empty by default — models are added from the app instead (pull one, or import
      # any .gguf from MODEL_DIR), and nothing needs to be named here.
      - MODEL_FILE=${MODEL_FILE:-}
      # Optional: a mmproj/CLIP projector .gguf, paired with MODEL_FILE to give it
      # vision. Empty by default — plain-text models don't need one.
      - MMPROJ_FILE=${MMPROJ_FILE:-}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-32768}
      # No default here on purpose, unlike everything else on this list — quantizing
      # the KV cache (not the model weights) trades answer quality for VRAM headroom,
      # which is only a trade worth making on hardware tight enough to need it. Bare
      # (no `:-...`) so it's simply absent from the container's environment, and
      # Ollama falls back to its own real default, unless a deployment's own local
      # the root `.env` sets it — see `.env.example` for how. Also needs
      # OLLAMA_FLASH_ATTENTION=1 to actually take effect at all (silently ignored
      # otherwise), so that one belongs in the same opt-in `.env`, not defaulted here
      # either.
      - OLLAMA_KV_CACHE_TYPE
      - OLLAMA_FLASH_ATTENTION
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-2h}
      # Ollama's own default (5m) can be too short for a large, mostly-CPU-offloaded
      # model under real desktop memory pressure — this only gives a slow-but-viable
      # load more time to finish, it doesn't change how much memory it needs.
      - OLLAMA_LOAD_TIMEOUT=${OLLAMA_LOAD_TIMEOUT:-15m}
    volumes:
      - ".:/root"
      # Mounts wherever MODEL_DIR points as a whole directory, read-only, rather than
      # binding MODEL_FILE in individually — lets MMPROJ_FILE sit alongside it and be
      # picked up the same way, with no extra per-file mount to keep in sync. Lets the
      # .gguf(s) live on faster storage than this project's own directory without
      # touching start.sh/Modelfile.template, which only ever see them at
      # /root/models/<file>.
      - "${MODEL_DIR:-.}:/root/models:ro"
      # Ollama's own model store (~/.ollama, i.e. /root/.ollama here) is a separate
      # copy it builds from the .gguf above via `ollama create` — this is what
      # actually gets read at load time, so it needs to be on fast storage too, not
      # just the source file. Points at OLLAMA_DATA_DIR so it's as relocatable as
      # the model file itself.
      - "${OLLAMA_DATA_DIR:-./.ollama}:/root/.ollama"
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - app-net
    entrypoint: ["/bin/sh", "/root/start.sh"]
    # Almost every outbound call (Ollama's cloud calls included) resolves a hostname
    # first — pointing DNS at the container's own loopback, where nothing listens on
    # port 53, makes any such lookup fail instantly instead of hanging on a timeout.
    # Doesn't touch routing/port-publishing at all (unlike an isolated network, which
    # broke the published port here), and local serving needs no DNS to work.
    dns:
      - 127.0.0.1
    group_add:
      - "987"
      - "983"

  # Optional, NOT part of the default stack — a raw llama.cpp server build
  # (community image, not Ollama) with Multi-Token Prediction (speculative
  # decoding) support compiled in, since Ollama 0.34.0 has no --spec-type/MTP flag
  # at all (confirmed via `ollama serve --help`) and would silently ignore the MTP
  # draft-head tensors already baked into some of our GGUFs (confirmed present on
  # the Qwen3.8-27B quants this was originally tuned against: `blk.<N>.nextn.
  # {eh_proj,enorm,hnorm,shared_head_norm}.weight` — not every model has these).
  #
  # A clean, isolated A/B (short prompt, thinking off) measured this service at
  # 1.78x Ollama's speed on that model's daily-driver quant (39.36 vs 22.12
  # tok/s). But real usage through the actual chat API — full system prompt +
  # tool schema + conversation history, ~7,000+ tokens of context, not a fresh
  # short prompt — told a very different story: sustained ~4-5 tok/s, unbearably
  # slow, because MTP's draft-acceptance rate craters on exactly the kind of
  # exploratory/uncertain content real turns spend a lot of time on (measured
  # 0.85 -> 0.50 -> 0.15 across consecutive turns in one real chat), and the
  # fixed ROCm TOP_K-sampler-CPU-fallback tax per draft step doesn't scale down
  # to match. See project memory for the fuller writeup, including a case where
  # MTP *did* clearly win — this is genuinely task-dependent, not a flat "don't
  # use it," which is why it's kept configured and easy to reach for rather than
  # deleted: `docker compose up -d llama-mtp mtp-proxy`, then point the backend's
  # `ollama.url` (backend/data/settings.json) at `http://localhost:11435` instead.
  #
  # `profiles: ["mtp"]` is what keeps this (and `mtp-proxy` below) out of a plain
  # `docker compose up -d` (confirmed: Compose excludes a profiled service from a
  # no-args `up`, but still starts it fine when named explicitly, as above) —
  # without it, `up -d` brings up every defined service including this one, and
  # it and `ollama` loading a model into this same 16GB card at once is exactly
  # the VRAM contention this project has hit before (twice in one night, in fact
  # — see project memory).
  llama-mtp:
    profiles: ["mtp"]
    image: "ollama/ollama:rocm"
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    ulimits:
      memlock: -1
    environment:
      - GGML_BACKEND_PATH=/usr/lib/ollama/rocm_v7_2/libggml-hip.so
      - LD_LIBRARY_PATH=/usr/lib/ollama:/usr/lib/ollama/rocm_v7_2
      - ROCR_VISIBLE_DEVICES=0
      - MODEL_FILE=${MODEL_FILE:-Qwen3.6-35B-A3B-UD-IQ3_XXS-MTP.gguf}
      - MMPROJ_FILE=${MMPROJ_FILE:-}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-48000}
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q4_0}
      - LLAMA_MTP_SPEC_DRAFT_N_MAX=${LLAMA_MTP_SPEC_DRAFT_N_MAX:-3}
    volumes:
      - ".:/root"
      - "${MODEL_DIR:-.}:/models:ro"
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - app-net
    group_add:
      - "987"
      - "983"
    entrypoint: ["/bin/sh", "/root/start-mtp.sh"]

  # Translates Ollama's `/api/chat`/`/api/generate` wire format to llama-mtp's
  # OpenAI-compatible one, so `backend/src/services/llm.rs`'s `OllamaService`
  # (Ollama-specific request/response structs) can talk to `llama-mtp` with zero
  # changes to that module. Its own port (11435), distinct from `ollama`'s
  # (11434) — `ollama` isn't behind a profile and always starts, so the two
  # never fight over the same port even if both happen to be up at once;
  # switching which one the backend actually talks to is still the one
  # `ollama.url` edit in `backend/data/settings.json` described above.
  mtp-proxy:
    profiles: ["mtp"]
    build: ./mtp-proxy
    image: llm-tulpa-mtp-proxy:latest
    environment:
      - LLAMA_SERVER_URL=http://llama-mtp:8080
    ports:
      - "127.0.0.1:11435:8080"
    networks:
      - app-net
    depends_on:
      - llama-mtp
