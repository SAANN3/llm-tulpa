name     = "example"
subname  = "hello"
version  = "0.1.0"
protocol = 1
summary  = "Greets people by name: the smallest plugin that has a tool"
help_message = "An example external plugin. It adds one tool, hello.greet, that the model can use to greet someone."
# It takes no settings, so it can come up switched on
default_enabled = true
sdk      = "rust"
kind     = "source"

build = "cargo build --release"
run   = "{plugin_dir}/target/release/tulpa-example-hello"

# exit 0 = ready; what it prints is shown when it is not
check = "cargo --version"
