name     = "weather"
subname  = "forecast"
version  = "0.1.0"
protocol = 1
summary  = "Current weather and a short forecast for any city"
help_message = "Gives the model two tools, weather.get_current and weather.get_forecast, so it can answer what the weather is in a city. Choose the units and a default city below (the city is used when you ask about the weather without naming one); the plugin's tab lists a few cities with their weather. The figures are generated from the city's name and the date, not read from a weather service: to make the plugin real, replace forecast_for() in main.py with a call to one."
sdk      = "python"
kind     = "source"

# Nothing to build: Python runs the file as it is
run = "python3 {plugin_dir}/main.py"

# exit 0 = ready; what it prints is shown when it is not
check = "python3 -c \"import sys; sys.exit(0 if sys.version_info >= (3, 10) else 'needs Python 3.10 or newer')\""

# Filled in on the Plugins page; neither is required
[[settings]]
name        = "units"
type        = "string"
description = "celsius or fahrenheit; celsius when empty"
required    = false

[[settings]]
name        = "default_city"
type        = "string"
description = "The city the weather is for when none is named, for example Berlin"
required    = false

# A tab of its own in Settings
[tab]
id    = "weather"
title = "Weather"
