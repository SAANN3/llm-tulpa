events {}

http {
    # One request every 10s, and up to 3 more allowed to queue (delayed, not
    # rejected) rather than fired off immediately — a burst of web.search_query
    # calls from the agent gets spaced out into one search every ~10s instead of
    # slamming google/bing/duckduckgo all at once. Keyed on a constant rather than
    # the client address since the only client that will ever reach this is the
    # backend itself (loopback-only, see compose.yaml).
    limit_req_zone $host zone=searxng_calls:1m rate=6r/m;

    server {
        # 8090, not searxng's own 8080 — both containers run under
        # network_mode: host now (see compose.yaml), so they share the host's
        # single port space and can't both bind 8080.
        listen 8090;

        location / {
            # No `nodelay` — the default behavior queues/delays requests beyond
            # the rate instead of answering them immediately, which is the actual
            # point here (spacing calls out, not just capping a burst).
            limit_req zone=searxng_calls burst=3;
            limit_req_status 429;

            # 127.0.0.1, not the service name `searxng` — host networking has no
            # embedded Docker DNS, but both containers share the host's real
            # loopback, so this reaches searxng's own host-bound 8080 directly.
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
